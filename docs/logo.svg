<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="192" height="192">
  <!-- MIRAGE-NODE mark : tally-M struck by the catch.
       Ink plate · paper strokes · signal-red diagonal · ghost echo = mirage. -->
  <rect x="4" y="4" width="88" height="88" rx="14" fill="#161913"/>

  <!-- mirage echo (offset ghost) -->
  <g transform="translate(3,-3)" opacity="0.22">
    <rect x="23" y="29" width="6" height="38" rx="3" fill="#EEEEE8"/>
    <rect x="35" y="29" width="6" height="38" rx="3" fill="#EEEEE8"/>
    <rect x="47" y="29" width="6" height="38" rx="3" fill="#EEEEE8"/>
    <rect x="59" y="29" width="6" height="38" rx="3" fill="#EEEEE8"/>
  </g>

  <!-- tally strokes -->
  <g>
    <rect x="23" y="29" width="6" height="38" rx="3" fill="#EEEEE8"/>
    <rect x="35" y="29" width="6" height="38" rx="3" fill="#EEEEE8"/>
    <rect x="47" y="29" width="6" height="38" rx="3" fill="#EEEEE8"/>
    <rect x="59" y="29" width="6" height="38" rx="3" fill="#EEEEE8"/>
  </g>

  <!-- the catch : one strike across all -->
  <line x1="17" y1="73" x2="72" y2="21" stroke="#B3261E" stroke-width="7" stroke-linecap="round"/>
</svg>
